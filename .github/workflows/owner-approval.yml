name: Owner approval

on:
  pull_request_target:
    # opened/synchronize/reopened already cover a new head. edited and
    # ready_for_review were a second Evaluate owner approval on the same SHA.
    types: [opened, synchronize, reopened]
  workflow_run:
    workflows: [Approval policy tests]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: owner-approval-${{ github.event.pull_request.head.sha || github.run_id }}
  cancel-in-progress: true

jobs:
  publish:
    name: Evaluate owner approval
    if: github.event_name != 'workflow_run' || github.event.workflow_run.event == 'pull_request_review'
    runs-on: ubuntu-latest
    steps:
      # Only default-branch code can publish the required status; no PR checkout or artifacts.
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/github-script@v7
        with:
          script: |
            const { publishApproval } = require('./.github/scripts/owner-approval.cjs');
            await publishApproval({ github, context, core });
