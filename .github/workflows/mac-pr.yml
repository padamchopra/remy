name: Mac PR

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: mac-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # One job so GitHub publishes a single Build Mac app check. Path decide still
  # skips install, tests, and pack:mac when the Mac app did not change.
  build:
    name: Build Mac app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- \
            'desktop/**' 'server/**' 'web/**' package.json \
            .github/workflows/mac.yml .github/workflows/mac-pr.yml '.github/actions/**' \
            ':(exclude,glob)**/*.md'; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "Nothing in the Mac app changed."
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "The Mac app changed."
          fi

      - uses: actions/setup-node@v4
        if: steps.paths.outputs.build == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            contract/package-lock.json
            server/package-lock.json
            web/package-lock.json
            desktop/package-lock.json

      - name: Install
        if: steps.paths.outputs.build == 'true'
        run: npm run install:mac

      - name: Test update handoff
        if: steps.paths.outputs.build == 'true'
        env:
          NODE_OPTIONS: --import=${{ github.workspace }}/contract/node_modules/tsx/dist/loader.mjs
        run: |
          npm --prefix desktop test
          npm --prefix server run build
          node --test server/dist/hub-thread-branch.test.js server/dist/hosted-git-config.test.js server/dist/hosted-sprite-lease.test.js server/dist/app-update.test.js server/dist/service-restart*.test.js server/dist/ticket-tool-auth.test.js

      - name: Build unsigned app
        if: steps.paths.outputs.build == 'true'
        run: npm run pack:mac
