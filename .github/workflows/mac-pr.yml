name: Mac PR

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: mac-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    name: Decide whether the Mac app changed
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.paths.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- \
            'desktop/**' 'server/**' 'web/**' package.json \
            .github/workflows/mac.yml .github/workflows/mac-pr.yml '.github/actions/**' \
            ':(exclude,glob)**/*.md'; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "Nothing in the Mac app changed."
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "The Mac app changed."
          fi

  package:
    name: Package Mac app
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            web/package-lock.json
            desktop/package-lock.json

      - name: Install
        run: npm run install:mac

      - name: Build unsigned app
        run: npm run pack:mac

  required:
    name: Build Mac app
    needs: [changes, package]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require the relevant result
        env:
          BUILD_NEEDED: ${{ needs.changes.outputs.build }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
        run: |
          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "The Mac build decision failed."
            exit 1
          fi
          if [ "$BUILD_NEEDED" = "true" ] && [ "$PACKAGE_RESULT" != "success" ]; then
            echo "The Mac app did not build successfully."
            exit 1
          fi
          if [ "$BUILD_NEEDED" = "true" ]; then
            echo "The Mac app built successfully."
          else
            echo "The Mac app did not change."
          fi
