name: Web

on:
  pull_request:
    paths:
      - ".github/workflows/web.yml"
      - "contract/**"
      - "hub/**"
      - "server/**"
      - "web/**"
      - "package.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/web.yml"
      - "contract/**"
      - "hub/**"
      - "server/**"
      - "web/**"
      - "package.json"

permissions:
  contents: read

concurrency:
  group: web-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
          cache-dependency-path: |
            contract/package-lock.json
            hub/package-lock.json
            hub/runtime/package-lock.json
            server/package-lock.json
            web/package-lock.json
      - run: npm ci --prefix contract --no-audit --no-fund
      - run: npm ci --prefix hub --no-audit --no-fund
      - run: npm ci --prefix server --no-audit --no-fund
      - run: npm ci --prefix web --no-audit --no-fund
      - run: npm ci --prefix hub/runtime --no-audit --no-fund
      - run: npm run build:hub --prefix web
      - run: npm run build --prefix server
      - run: node hub/scripts/check-runtime-bundle.mjs
      - run: npx playwright-core install --with-deps chromium
        working-directory: web
      - name: Check the complete thread journey
        run: node web/scripts/qa-thread-journey.mjs
      - name: Check public home and web app
        run: |
          node web/scripts/serve-hub.mjs web/dist 5180 &
          server_pid=$!
          node web/scripts/hosted-runtime-check.mjs &
          runtime_pid=$!
          QA_SCOPE_ONLY=1 node web/scripts/hosted-runtime-check.mjs &
          scope_pid=$!
          trap 'kill "$server_pid" "$runtime_pid" "$scope_pid" 2>/dev/null || true' EXIT
          wait "$scope_pid"
          node web/scripts/hub-website-check.mjs
          node web/scripts/workspaces-load-check.mjs
          node web/scripts/pull-request-tile-check.mjs
          QA_COMPUTER_ONLY=1 node web/scripts/hosted-runtime-check.mjs
          QA_BRANCH_ONLY=1 node web/scripts/hosted-runtime-check.mjs
          QA_DEFAULTS_ONLY=1 node web/scripts/hosted-runtime-check.mjs
          QA_PROFILE_ONLY=1 node web/scripts/hosted-runtime-check.mjs
          QA_START_ONLY=1 node web/scripts/hosted-runtime-check.mjs
          QA_COMPUTER_DEFAULTS_ONLY=1 node web/scripts/hosted-runtime-check.mjs
          QA_COMPOSER_ONLY=1 node web/scripts/hosted-runtime-check.mjs
          QA_THREAD_RECOVERY_ONLY=1 node web/scripts/hosted-runtime-check.mjs
          wait "$runtime_pid"
          node --test web/scripts/thread-start-recovery.test.mjs web/scripts/message-markdown.test.mjs
          node --test hub/scripts/local-development.test.mjs
          node --test hub/scripts/local-production-bridge.test.mjs
          node --test hub/scripts/local-account.test.mjs
          node --test hub/scripts/local-runtime.test.mjs
          node --test web/scripts/hosted-preview.test.mjs web/scripts/hub-resource.test.mjs web/scripts/qa-hosted-account.test.mjs web/scripts/workspace-image-cache.test.mjs web/scripts/hub-workspace-cache.test.mjs web/scripts/hub-thread-cache.test.mjs web/scripts/hub-transcript.test.mjs web/scripts/workspace-list.test.mjs web/scripts/hub-models.test.mjs web/scripts/thread-menu.test.mjs web/scripts/route.test.mjs web/scripts/thread-start-progress.test.mjs web/scripts/pull-request-workspace.test.mjs web/scripts/pull-request-order.test.mjs web/scripts/pull-request-checks.test.mjs web/scripts/pull-request-patch.test.mjs web/scripts/markdown-html-comments.test.mjs web/scripts/pull-request-detail.test.mjs web/scripts/diff-words.test.mjs web/scripts/pull-request-review-state.test.mjs web/scripts/pull-request-activity.test.mjs web/scripts/review-agent.test.mjs web/scripts/markdown-html.test.mjs web/scripts/environment-text.test.mjs
      - name: Check the built website
        env:
          WEBSITE_URL: http://127.0.0.1:5181
        run: |
          python3 -m http.server 5181 --bind 127.0.0.1 --directory web/dist-website &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..30}; do curl --silent --fail http://127.0.0.1:5181/ > /dev/null && break; sleep 1; done
          node web/scripts/website-check.mjs
          node web/scripts/website-performance.mjs
          node web/scripts/sidebar-resize-check.mjs
      - run: npm test --prefix contract
      - run: npm run typecheck --prefix contract
      - run: npm test --prefix hub
      - run: npm run typecheck --prefix hub
      - run: npm run test --prefix hub/runtime
      - run: npm run typecheck --prefix hub/runtime
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: website-preview
          path: |
            web/dist-website
            /tmp/remy-pr-artifacts/website
