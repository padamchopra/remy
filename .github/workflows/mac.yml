name: Mac

on:
  # A merge that changes what the app is made of ships it. The nightly is the
  # safety net for a merge whose build never ran or did not finish.
  push:
    branches: [main]
  schedule:
    - cron: "5 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Signing and notarising take minutes. Let a run finish rather than cancelling
# it under a second merge; the marker branch keeps the two from shipping twice.
concurrency:
  group: mac
  cancel-in-progress: false

jobs:
  # Decide on a cheap runner whether there is anything to ship, so a quiet day
  # does not sign and notarise the same commit again under a new version.
  preflight:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.decide.outputs.build }}
      sha: ${{ steps.decide.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          # History, so the marker branch can be compared with this commit.
          fetch-depth: 0

      - id: decide
        uses: ./.github/actions/build-needed
        with:
          branch: nightly/mac
          # The DMG is the window, the daemon and the web build together, so a
          # change to any of them changes the app somebody downloads.
          paths: |
            desktop/**
            server/**
            web/**
            package.json
            .github/workflows/mac.yml
            .github/actions/**
            :(exclude,glob)**/*.md

  dmg:
    needs: preflight
    if: needs.preflight.outputs.build == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            web/package-lock.json
            desktop/package-lock.json

      - name: Require signing secrets
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=
          for name in CSC_LINK APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER APPLE_TEAM_ID; do
            eval "value=\${$name}"
            if [ -z "$value" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Unsigned GitHub downloads are blocked by macOS. Missing secrets:$missing. See README Publishing a Mac build."
            exit 1
          fi

      - name: App Store Connect API key
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          node desktop/scripts/write-asc-key.mjs "$key_path"
          chmod 600 "$key_path"
          echo "APPLE_API_KEY=$key_path" >> "$GITHUB_ENV"

      - name: Version
        id: version
        run: |
          version="$(node desktop/scripts/stamp-version.mjs)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "Stamped $version from run ${GITHUB_RUN_NUMBER}"

      - name: Install
        run: npm run install:mac

      - name: Build, sign, and notarize
        run: npm run pack:mac
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - uses: actions/upload-artifact@v4
        with:
          name: remy-macos
          path: |
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/*.blockmap
            desktop/release/latest*.yml

      - uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          artifacts: desktop/release/*.dmg,desktop/release/*.zip,desktop/release/*.blockmap,desktop/release/latest*.yml
          generateReleaseNotes: true
          allowUpdates: true
          omitBodyDuringUpdate: true
          replacesArtifacts: true
          makeLatest: true
          token: ${{ secrets.GITHUB_TOKEN }}

      # Last, so a release that did not happen is one the next run tries again.
      - uses: ./.github/actions/mark-shipped
        with:
          branch: nightly/mac
          sha: ${{ needs.preflight.outputs.sha }}
