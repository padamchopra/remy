name: Release PR

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: release-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # One job so GitHub publishes a single Build computer check. Path decide still
  # skips install and tests when nothing a computer runs changed.
  build:
    name: Build computer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- \
            'contract/**' 'server/**' 'web/**' package.json 'scripts/**' \
            .github/workflows/release.yml .github/workflows/release-pr.yml '.github/actions/**' \
            ':(exclude,glob)**/*.md'; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "Nothing a computer runs changed."
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "What a computer runs changed."
          fi

      - uses: actions/setup-node@v4
        if: steps.paths.outputs.build == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            contract/package-lock.json
            server/package-lock.json
            web/package-lock.json

      - name: Install
        if: steps.paths.outputs.build == 'true'
        run: npm run install:computer

      - name: Test the daemon and the CLI
        if: steps.paths.outputs.build == 'true'
        env:
          NODE_OPTIONS: --import=${{ github.workspace }}/contract/node_modules/tsx/dist/loader.mjs
        run: npm --prefix contract test && npm --prefix server test && node --test scripts/cli-package.test.mjs

      - name: Build the web app
        if: steps.paths.outputs.build == 'true'
        run: npm run build
