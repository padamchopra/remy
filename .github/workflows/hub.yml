name: Hub

on:
  pull_request:
    paths:
      - ".github/workflows/hub.yml"
      - "contract/**"
      - "hub/**"
      - "web/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
          cache-dependency-path: |
            contract/package-lock.json
            hub/package-lock.json
            web/package-lock.json
      - run: npm ci --prefix contract --no-audit --no-fund
      - run: npm ci --prefix hub --no-audit --no-fund
      - run: npm ci --prefix web --no-audit --no-fund
      - run: npm ci --prefix hub/runtime --no-audit --no-fund
      - run: npm run build:hub --prefix web
      - run: node hub/scripts/check-runtime-bundle.mjs
      - run: npx playwright-core install --with-deps chromium
        working-directory: web
      - name: Check public home and web app
        run: |
          node web/scripts/serve-hub.mjs web/dist 5180 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          node web/scripts/hub-website-check.mjs
          node web/scripts/hosted-runtime-check.mjs
          QA_COMPUTER_ONLY=1 node web/scripts/hosted-runtime-check.mjs
          QA_BRANCH_ONLY=1 node web/scripts/hosted-runtime-check.mjs
          QA_DEFAULTS_ONLY=1 node web/scripts/hosted-runtime-check.mjs
          QA_PROFILE_ONLY=1 node web/scripts/hosted-runtime-check.mjs
          QA_START_ONLY=1 node web/scripts/hosted-runtime-check.mjs
          QA_COMPUTER_DEFAULTS_ONLY=1 node web/scripts/hosted-runtime-check.mjs
          QA_COMPOSER_ONLY=1 node web/scripts/hosted-runtime-check.mjs
          QA_SCOPE_ONLY=1 node web/scripts/hosted-runtime-check.mjs
          node --test web/scripts/hosted-preview.test.mjs web/scripts/qa-hosted-account.test.mjs web/scripts/workspace-image-cache.test.mjs web/scripts/hub-models.test.mjs web/scripts/thread-menu.test.mjs web/scripts/route.test.mjs
      - run: npm test --prefix contract
      - run: npm run typecheck --prefix contract
      - run: npm test --prefix hub
      - run: npm run typecheck --prefix hub
      - run: npm run test --prefix hub/runtime
      - run: npm run typecheck --prefix hub/runtime
