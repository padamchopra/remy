name: Hub

on:
  pull_request:
    paths:
      - ".github/workflows/hub.yml"
      - "contract/**"
      - "hub/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/hub.yml"
      - "contract/**"
      - "hub/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
          cache-dependency-path: |
            contract/package-lock.json
            hub/package-lock.json
      - run: npm ci --prefix contract --no-audit --no-fund
      - run: npm ci --prefix hub --no-audit --no-fund
      - run: npm test --prefix contract
      - run: npm run typecheck --prefix contract
      - run: npm test --prefix hub
      - run: npm run typecheck --prefix hub

  deploy-staging:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    environment: staging
    env:
      HUB_URL: ${{ vars.HUB_URL }}
      RELEASE: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
          cache-dependency-path: |
            contract/package-lock.json
            hub/package-lock.json
      - run: npm ci --prefix contract --no-audit --no-fund
      - run: npm ci --prefix hub --no-audit --no-fund
      - run: npm run deploy --prefix hub -- staging
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  deploy-production:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    env:
      HUB_URL: ${{ vars.HUB_URL }}
      RELEASE: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
          cache-dependency-path: |
            contract/package-lock.json
            hub/package-lock.json
      - run: npm ci --prefix contract --no-audit --no-fund
      - run: npm ci --prefix hub --no-audit --no-fund
      - run: npm run deploy --prefix hub -- production
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
