name: Approval policy tests

on:
  pull_request:
    types: [opened, synchronize, reopened]
  pull_request_review:
    types: [submitted, edited, dismissed]

permissions: {}

jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test .github/scripts/owner-approval.test.cjs
  review-activity:
    if: github.event_name == 'pull_request_review'
    runs-on: ubuntu-latest
    steps:
      # The trusted workflow_run listener reads reviews itself, including on fork PRs.
      - run: echo "A review changed; reevaluate current approvals."
