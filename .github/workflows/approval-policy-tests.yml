name: Approval policy tests

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/owner-approval.md"
      - ".github/scripts/owner-approval.cjs"
      - ".github/scripts/owner-approval.test.cjs"
      - ".github/workflows/approval-policy-tests.yml"
      - ".github/workflows/owner-approval.yml"
  pull_request_review:
    types: [submitted, edited, dismissed]

permissions: {}

jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test .github/scripts/owner-approval.test.cjs
